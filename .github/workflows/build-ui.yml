name: Build Robocap Decryptor

on:
  workflow_dispatch:
  push:
    tags: ["ui-v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26-intel
            name: macOS-x86_64
            artifact: RobocapDecryptor-macos-x86_64
            dmg: RobocapDecryptor-macos-x86_64.dmg
          - os: macos-26
            name: macOS-arm64
            artifact: RobocapDecryptor-macos-arm64
            dmg: RobocapDecryptor-macos-arm64.dmg
          - os: windows-latest
            name: Windows-x64
            artifact: RobocapDecryptor-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - name: Locate and verify Windows FFmpeg runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ffmpeg = Get-ChildItem -Path "$env:ChocolateyInstall\lib" -Filter ffmpeg.exe -File -Recurse |
            Where-Object { Test-Path (Join-Path $_.DirectoryName 'ffprobe.exe') } |
            Select-Object -First 1
          if (-not $ffmpeg) { throw 'Could not find the installed FFmpeg bin directory.' }
          $ffprobe = Join-Path $ffmpeg.DirectoryName 'ffprobe.exe'
          & $ffmpeg.FullName -version | Select-Object -First 1
          if ($LASTEXITCODE -ne 0) { throw 'ffmpeg.exe failed to start on the build runner.' }
          & $ffprobe -version | Select-Object -First 1
          if ($LASTEXITCODE -ne 0) { throw 'ffprobe.exe failed to start on the build runner.' }
          Add-Content -Path $env:GITHUB_ENV -Value "ROBOCAP_FFMPEG_DIR=$($ffmpeg.DirectoryName)"
      - name: Install application dependencies
        working-directory: python/UI
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Build application
        working-directory: python/UI
        run: python -m PyInstaller --noconfirm --clean RobocapDecryptor.spec
      - name: Create macOS DMG
        if: runner.os == 'macOS'
        working-directory: python/UI
        run: |
          hdiutil create -volname RobocapDecryptor -srcfolder dist/RobocapDecryptor.app -ov -format UDZO "dist/${{ matrix.dmg }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.os == 'Windows' && 'python/UI/dist/RobocapDecryptor.exe' || format('python/UI/dist/{0}', matrix.dmg) }}
          if-no-files-found: error
          retention-days: 30

  publish-release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: RobocapDecryptor-*
          path: release-assets
      - name: Publish downloadable builds
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            release-assets/RobocapDecryptor-windows-x64/RobocapDecryptor.exe
            release-assets/RobocapDecryptor-macos-x86_64/RobocapDecryptor-macos-x86_64.dmg
            release-assets/RobocapDecryptor-macos-arm64/RobocapDecryptor-macos-arm64.dmg
